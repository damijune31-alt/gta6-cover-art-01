<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON HEAT — Midnight Run Cover Maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="masthead">
    <h1>NEON HEAT</h1>
    <p class="tagline">Midnight Run Cover Maker — Vice City Sunset Edition</p>
  </header>

  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="Cover preview"></canvas>
    <p class="hint">Pick a panel, drop in your photo, edit the caption, export a PNG.</p>
  </section>

  <section class="editor" id="editor">
    <div class="group">
      <label>Panel</label>
      <div class="panels" id="panelPicker"></div>
    </div>

    <div class="group">
      <label for="photoFile">Photo for panel <span id="panelLabel">1</span></label>
      <input type="file" id="photoFile" accept="image/*">
      <div class="sliders">
        <label>Zoom <input type="range" id="zoom" min="1" max="3" step="0.05" value="1"></label>
        <label>Move X <input type="range" id="offsetX" min="-0.5" max="0.5" step="0.01" value="0"></label>
        <label>Move Y <input type="range" id="offsetY" min="-0.5" max="0.5" step="0.01" value="0"></label>
      </div>
    </div>

    <div class="group">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" value="NEON HEAT" maxlength="24">
      <label for="subtitleInput">Subtitle</label>
      <input type="text" id="subtitleInput" value="Midnight Run" maxlength="32">
    </div>

    <div class="group">
      <label for="gradePicker">Grade</label>
      <select id="gradePicker">
        <option value="sunset" selected>Sunset</option>
        <option value="neon">Neon</option>
        <option value="vice">Vice</option>
        <option value="golden">Golden</option>
      </select>
      <label for="sizePicker">Size</label>
      <select id="sizePicker">
        <option value="square" selected>Square 1080 × 1080</option>
        <option value="portrait">Portrait 1080 × 1350</option>
        <option value="landscape">Landscape 1920 × 1080</option>
      </select>
    </div>

    <div class="group actions">
      <button type="button" id="fillAll">Fill all panels with one photo</button>
      <button type="button" id="exportBtn" class="primary">Export PNG</button>
      <a id="downloadLink" download="neon-heat-cover.png" hidden>Download</a>
    </div>
  </section>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
